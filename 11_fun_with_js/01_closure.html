<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure</title>
</head>

<body style="background-color: #414141;">
    <button id="orange">Orange</button>
    <button id="green">Green</button>
</body>
<script>
    function outerFun() {
        let username = 'Shinigami'
        // console.log(`outerFun nickName: ${nickName}`); // nickName is not defined
        function innerFnOne() {
            let nickName = 'Nick name... in funOne';
            console.log(`innerFnOne name: ${username}`);
        }
        function innerFnTwo() {
            console.log(`innerFnTwo name: ${username}`);
            // console.log(`innerFnTwo nickName: ${nickName}`); // nickName is not defined
        }
        innerFnOne();
        innerFnTwo();
    }
    outerFun();

</script>

<script>
    document.querySelector('#orange').addEventListener('click', clickHandler('orange'))
    document.querySelector('#green').addEventListener('click', clickHandler('green'))

    function clickHandler(color) {
        return function() {
            document.body.style.backgroundColor = color
        }
    }

</script>

</html>
